# 鲸域 · 云服务器 Nginx 配置
#
# 定位：这台机器只跑 API，不服务静态资源。
#       静态资源（html/css/js）全部由 CDN + COS 承载。
#
# 域名规划：
#   www.example.com  -> CDN -> COS      静态前端
#   api.example.com  -> 本机 127.0.0.1:3000   API
#
# 部署路径：/etc/nginx/conf.d/jingyu.conf
# 证书：腾讯云免费证书，放到 /etc/nginx/ssl/ 下

# ---------- API 服务 ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # 强制跳 HTTPS（申请证书后启用，初次部署可先注释）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # API 响应都很小，压缩收益有限但没坏处
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传体积上限：头像 / 帖子配图。原图建议前端先压缩再传
    client_max_body_size 8m;

    # 只允许前端域名跨域访问
    add_header Access-Control-Allow-Origin  "https://www.example.com" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket：聊天模块需要长连接
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # 聊天长连接别设太短
        proxy_send_timeout    60s;

        # API 一律不缓存
        add_header Cache-Control "no-store" always;
    }

    # 健康检查，给负载均衡 / 监控用
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ---------- WebSocket 升级头映射 ----------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- 静态资源兜底（仅开发/应急用） ----------
# 正常情况静态资源走 CDN，这个 server 块平时不启用。
# 应急时把 DNS 切回来，可以直接由这台机器出静态文件。
server {
    listen 8080;
    server_name _;

    root /var/www/jingyu/dist;
    index index.html;

    # 带哈希的资源，长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 入口文件，不缓存
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 鲸鱼娘登录卡（登录页左列的 iframe 目标）：外壳不缓存，素材长缓存
    # 用 `expires` 而不是 add_header，避免覆盖 server 级的 X-Frame-Options / nosniff
    location = /whale/index.html {
        expires -1;
    }

    location /whale/assets/ {
        expires 7d;
        access_log off;
    }

    # 107 段 webm 共约 60MB，文件名不含哈希：7 天缓存，换素材时改名或部署后刷 CDN
    location /whale/clips-rand/ {
        expires 7d;
        access_log off;
        types { video/webm webm; }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
