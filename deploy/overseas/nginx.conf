# 鲸域 · 境外站点 Nginx 配置（单域名，静态 + API 同源）
#
# 与 deploy/nginx.conf 的差别：
#   线上大陆机跑的是「单域名单站点」形态（静态 dist + /api 反代），不是那份
#   「api.example.com + COS/CDN」的规划稿。境外机没有 COS，静态直接本机出，
#   同源也就没有 CORS 和 cookie 跨站问题。
#
# 部署路径：/etc/nginx/sites-available/jingyu.conf
# 本文件是模板，由 deploy/overseas/deploy.sh 渲染后上传，不要手改生成物。
# 模板变量（双下划线包裹）：域名 / 应用根目录 / 证书链路径 / 私钥路径。
# 证书没签下来时，脚本会先指到自签证书，保证 nginx -t 能过 ——
# 否则「改配置要证书、签证书要配置生效」会变成死循环。
#
# 兼容性说明：
#   证书的 http2 用 `listen 443 ssl http2` 而不是 nginx 1.25.1+ 才有的 `http2 on`。
#   Ubuntu 22.04 是 nginx 1.18、24.04 是 1.24，`http2 on` 在它们上面是 unknown directive，
#   直接让 nginx -t 失败。新版 nginx 会对这种写法打一条 deprecation 警告，只是警告。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- ACME 验证 + 强制跳 HTTPS ----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 证书签发和续期都靠这个 location，改配置时别删
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name __DOMAIN__;

    ssl_certificate     __CERT_CRT__;
    ssl_certificate_key __CERT_KEY__;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  __APP_DIR__/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;
    # 单 IP 并发连接上限，挡慢速连接/连接洪泛（2026-10-24 加固）
    limit_conn conn_per_ip 20;

    include /etc/nginx/snippets/jingyu-security-headers.conf;

    # ---- 扫描器快速丢弃 ----
    # 444 是 nginx 特有的「不回任何内容直接关连接」，比 403/404 省带宽也不给指纹。
    # 前端是 hash 路由，真实可达的路径只有 / 、/assets/、/uploads/、/whale/ 和 /api/，
    # 其余一律当作扫描。
    if ($request_uri ~* "^/(\.(?!well-known/)|wp-|wordpress|phpmyadmin|pma|vendor/|phpunit|laravel|cgi-bin|actuator|console|manager|solr|jenkins|backup|db\.|shell|xmlrpc|boaform|hnap1)") {
        return 444;
    }
    if ($request_uri ~* "\.(php|asp|aspx|jsp|cgi|sh|bak|sql|old|swp|zip|tar|gz|rar|7z)$") {
        return 444;
    }
    if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") {
        return 444;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 带内容哈希的资源：一年强缓存。文件名里有 hash，改内容就换名，不会脏读
    location /assets/ {
        # 攻击档（shield-mode: limit_req site_burst_strict 1r/s + limit_conn 6）是 server 级，
        # 会连带限死首屏那 20+ 个哈希资源 -> 真实用户整页 429 白屏。资源是内容哈希 + 磁盘直出，
        # 这里给一份宽松的独立额度（8r/s burst 120、32 并发），攻击档下也不再白屏。
        limit_req zone=bigfile_limit burst=120 nodelay;
        limit_conn conn_big 32;
        expires 1y;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 入口文件不能缓存，否则用户拿不到新的 assets 引用
    location = /index.html {
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 后台管理 SPA：入口与模块都不加哈希，统一短缓存；权限在服务端，静态文件公开无害
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/index.html =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # 本地落盘的上传图。用户内容同源提供，必须 nosniff（在安全头 snippet 里），
    # 防浏览器把上传的 .html/.svg 当页面执行
    location /uploads/ {
        alias __APP_DIR__/uploads/;
        expires 30d;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        add_header Content-Disposition "inline";
        access_log off;
        try_files $uri =404;
    }

    # 登录/注册：独立更严的限流。撞库在 nginx 层只能挡高频那部分，
    # 慢速低频靠应用层账号锁定（server/src/lockout.js）。
    location ~ ^/api/(auth/(login|register|reset)|user/password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # 插件条目库：6700+ 条公开只读目录，gzip 后仍有 1MB，是首屏最贵的一次请求。
    # 其余 /api/ 一律 no-store（登录态数据），这里单独放行 60 秒缓存：
    # 浏览器复用同一份目录，Cloudflare 也能把响应放进边缘缓存替源站扛并发。
    # 目录数据 60 秒的陈旧度可以接受（新插件最多晚 1 分钟出现在列表里）。
    location = /api/plugins {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        # Cache-Control 由后端给（同一份值），这里只补 CF 专用头，避免响应里出现两条 Cache-Control
        add_header Cloudflare-CDN-Cache-Control "public, max-age=60" always;
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # WebSocket 聊天：前端用 ?token=<JWT> 握手，access log 里落 query 等于把凭据写进磁盘
    location = /ws {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # 鲸鱼娘登录卡（登录页左列 iframe 目标）：外壳不缓存，素材长缓存
    location = /whale/index.html {
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /whale/assets/ {
        expires 7d;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }

    # 107 段 webm 共约 60MB，一屏会并发拉 1-2 段。
    # 单独 location 是为了绕开 location / 的限流，并强制 video/webm（默认 mime.types
    # 在部分版本里没有 webm，缺失会以 application/octet-stream 下发，Safari 不播）
    location /whale/clips-rand/ {
        expires 7d;
        include /etc/nginx/snippets/jingyu-security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        types { video/webm webm; }
        access_log off;
        try_files $uri =404;
    }

    # 前端 hash 路由（#/feed），路径部分永远只有 /。
    # 回退到 index.html 会让任意不存在的路径都返 200，扫描器据此认为站点「什么都有」，
    # 所以这里宁可 404。
    location / {
        try_files $uri =404;
    }
}
