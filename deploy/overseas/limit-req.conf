# 限流 zone 定义（必须放在 http 层，不能放 server 块里，所以单独进 conf.d）
#
# 部署位置：/etc/nginx/conf.d/00-limit-req.conf
# 文件名以 00- 开头，保证在 sites-enabled 的 server 块之前被加载
#
# 30r/s 的取值依据：前端首屏大约并发 15-25 个请求（JS chunk + 107 段 whale clips
# 里的 1-2 段 + 头像），留一倍余量。再高就挡不住撞库和爬虫，再低正常用户刷新会 429。

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 登录/注册单独一个更严的 zone。撞库的请求速率特征和正常浏览完全不同，
# 但 nginx 层拦不住「慢速低频」的撞库——那要靠应用层的账号锁定（线上已实现）。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=6r/m;
