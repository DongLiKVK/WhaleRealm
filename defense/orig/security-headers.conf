# 鲸域：统一安全响应头（nginx add_header 在 location 出现任一 add_header 时不继承父级，必须显式 include）
# HSTS：只在 HTTPS 下有意义。1 年 + includeSubDomains；暂不写 preload —— preload 一旦进浏览器内置列表几乎无法撤销，等确认长期可用再加。 前提：80 已 301 到 443、443 有受信证书，否则开了 HSTS 会把回退路堵死。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options   "nosniff" always;
add_header X-Frame-Options          "SAMEORIGIN" always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# ---------- CSP ----------
# 白名单是实测出来的，不要凭感觉改：
#   script-src 三条 sha256 分别对应 index.html 的主题首绘守卫、whale/index.html 的两段内联脚本
#     index.html  : sha256-LC4AixU9x/7XUxeAxlUIEjK8xqF8++/zkJv3jVQ1mmw=  (490 字符)
#     whale 段1   : sha256-WbLF9n0yAz/8U9lVn3C7MbLmGIR6UpDg9kJxh7tlkZI=
#     whale 段2   : sha256-SAsCBM8SvM6OojTclthAxQLUNWeAX4z83JsYIcNISrE=
#     页面改一个字符哈希就失效（表现为主题闪白 / 鲸鱼娘不加载），改完必须重算
#   style-src 'unsafe-inline' 是必需的：app.js 运行时到处生成 style="background:..." 和 <noscript><style>
#   img-src data: blob: 必需：favicon 是 data: SVG，默认头像是 dataURL，上传预览走 createObjectURL
#   media-src 本域：鲸鱼娘登录卡的 107 段 webm 在 /whale/clips-rand/ 下
#   frame-src 'self'：登录页左列同源 iframe 嵌 whale/index.html
#   connect-src 'self'：fetch 只打本站 /api；将来前端接 WebSocket 时同源 ws:// 由 'self' 覆盖
#   不写 upgrade-insecure-requests：本站还是纯 HTTP，写了会把自己升级到不存在的 https
#   配了 COS 之后：img-src / media-src / connect-src 必须放行桶域名
#     https://jingyu-1314329555.cos.ap-guangzhou.myqcloud.com
#     —— 图片从这里加载（img-src），浏览器直传是 PUT 到它（connect-src），少一个就白屏 / 上传失败
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha256-LC4AixU9x/7XUxeAxlUIEjK8xqF8++/zkJv3jVQ1mmw=' 'sha256-WbLF9n0yAz/8U9lVn3C7MbLmGIR6UpDg9kJxh7tlkZI=' 'sha256-SAsCBM8SvM6OojTclthAxQLUNWeAX4z83JsYIcNISrE='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avatars.githubusercontent.com  https://jingyu-1314329555.cos.ap-guangzhou.myqcloud.com; media-src 'self' blob: https://jingyu-1314329555.cos.ap-guangzhou.myqcloud.com; font-src 'self' data:; connect-src 'self' https://jingyu-1314329555.cos.ap-guangzhou.myqcloud.com; frame-src 'self'; form-action 'self'; frame-ancestors 'self'" always;
