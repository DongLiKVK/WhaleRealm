# 鲸域 · 443 站点（2026-10-29 启用正式证书 + 正常服务）
#
# 变更前：自签证书（CN=43.142.153.74，DSH Relay CA），除 /healthz 与 DSH 隧道外一律 301 回 HTTP。
# 变更后：LE 正式证书（seekbbs.cn + www.seekbbs.cn），与 80 端口同构地提供服务。
#
# 为什么 443 要和 80 一起服务而不是继续 301 回 HTTP：
#   登录态、支付、以及公安备案要求的传输安全都需要 HTTPS；301 回 HTTP 等于主动降级。
#   80 保留 301 到 HTTPS 是标准做法，见 jingyu-80.conf 的说明（待切换）。

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name seekbbs.cn www.seekbbs.cn _;

    ssl_certificate     /etc/letsencrypt/live/seekbbs.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seekbbs.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root  /var/www/jingyu/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    # ---- SCAN-DROP：与 80 端口同一套判据 ----
    if ($request_uri ~* "^(/\.(?!well-known/)|/wp-|/wordpress|/phpmyadmin|/pma|/vendor/|/phpunit|/laravel|/cgi-bin|/actuator|/console|/manager|/solr|/jenkins|/backup|/db\.|/shell|/xmlrpc|/mcp|/sse|/boaform|/hnap1)") {
        return 444;
    }
    if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") {
        return 444;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/dsh-tunnel.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME 续期也走 80，这里留一份以防 80 被临时改动
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location /uploads/ {
        alias /var/www/jingyu/uploads/;
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /whale/assets/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }
    location /whale/clips-rand/ {
        expires 30d;
        types { video/webm webm; }
        include /etc/nginx/snippets/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
