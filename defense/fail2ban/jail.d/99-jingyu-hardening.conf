# ============================================================================
# 鲸域 · 攻击测试期新增 jail（2026-10-29）
# 放在 jail.d/99- 前缀：与 jail.local 里的旧 jail 互不冲突，只新增不改旧
#
# 分工：
#   nginx-404scan   看「量」：20 次 404/60s
#   nginx-badreq    看「质」：1 次敏感路径
#   jingyu-shield   看「意图」：5 次 444/5min（扫描器 UA、注入载荷、SCAN-DROP）
#   jingyu-ratelimit 看「压力」：30 次 429/2min（被限流了还硬压）
#   jingyu-login    看「撞库」：8 次 401/10min 打登录接口
# ============================================================================

[jingyu-shield]
enabled   = true
port      = http,https
filter    = jingyu-shield
logpath   = /var/log/nginx/access.log
maxretry  = 5
findtime  = 300
bantime   = 1d
banaction = iptables-allports

[jingyu-ratelimit]
enabled   = true
port      = http,https
filter    = jingyu-ratelimit
logpath   = /var/log/nginx/access.log
maxretry  = 30
findtime  = 120
bantime   = 1h
banaction = iptables-multiport

[jingyu-login]
enabled   = true
port      = http,https
filter    = jingyu-login
logpath   = /var/log/nginx/access.log
maxretry  = 8
findtime  = 600
bantime   = 2h
banaction = iptables-multiport
