# 鲸域：被 nginx 限流器拒绝（429 Too Many Requests）
#
# 三种 zone 会产出 429：
#   site_burst / html_limit / bigfile_limit   每 IP 速率与并发
#   wr_limit                                  登录/注册/短信/上传 12 次/分钟
#   readme_limit                              /api/plugins/:id/readme 6 次/分钟
#
# 阈值 30 次/2 分钟：正常用户即使一次开 10 个标签页也远达不到；
# 一旦达到说明对方在拿脚本压接口，直接封 1 小时。

[Definition]

failregex = ^<HOST> - \S+ \[[^\]]*\] "[^"]*" 429 \d+

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
