# 鲸域：登录接口撞库 —— POST /api/auth/login 返回 401
#
# 应用层本来就有 lockout.js（WINDOW=900 MAX_FAILS=8），这里再做一层网络封禁：
# 8 次失败/10 分钟 → 封 2 小时。这样即使对方换账号撞库，也会在 IP 层被掐断。

[Definition]

failregex = ^<HOST> - \S+ \[[^\]]*\] "POST /api/auth/login[^"]*" 401 \d+

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
