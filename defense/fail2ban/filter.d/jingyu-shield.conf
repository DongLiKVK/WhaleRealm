# 鲸域：命中 nginx 防护层丢弃（return 444）—— 444 只由防护规则产生，绝无合法流量
#
# 444 是 nginx 的「不回任何字节直接断连」，本站只在这些地方返回它：
#   if ($bad_ua)  扫描器 UA（sqlmap/nuclei/ffuf...）
#   if ($bad_uri) SQLi / XSS / 路径穿越 / JNDI / 云元数据载荷
#   SCAN-DROP     .git / .env / wp- / phpmyadmin / phpunit / laravel / actuator ...
#   非法 HTTP 方法
# 所以一次 444 就是一次「明确的攻击意图」，5 次/5 分钟即封 24 小时。

[Definition]

failregex = ^<HOST> - \S+ \[[^\]]*\] "[^"]*" 444 \d+

ignoreregex =

datepattern = {^LN-BEG}%%ExY(?P<_sep>[-/.])%%m(?P=_sep)%%d[T ]%%H:%%M:%%S(?:[.,]%%f)?(?:\s*%%z)?
              ^[^\[]*\[({DATE})
              {^LN-BEG}
