# 鲸域 · 80 端口站点（2026-10-29 启用 HTTPS 后改为跳转）
#
# 变更历史：
#   2026-10-26  境内降为只读边缘，整站 307 回源境外
#   2026-10-29  境内恢复自服务（A 方案：境内唯一写入源）
#   2026-10-29  签下 LE 证书后，80 只保留 ACME 与跳 HTTPS
#   2026-10-29  攻击测试加固：与 443 同一套丢弃判据 + 跳转限流
#
# 为什么 80 不做全站 301 而是保留一条 ACME location：
#   certbot 的 webroot 验证要访问 http://seekbbs.cn/.well-known/acme-challenge/<token>。
#   若 80 一律 301 到 https，certbot 会跟随跳转；一旦 443 当天出问题（证书过期/nginx 起不来），
#   续期就会一起失败，形成「证书过期 → 无法续期」的死锁。所以 ACME 路径走 HTTP 直出。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name seekbbs.cn www.seekbbs.cn _;

    charset utf-8;
    client_max_body_size 8m;

    # ==== 2026-10-29 抗慢速 ====
    client_header_timeout        10s;
    client_body_timeout          15s;
    send_timeout                 20s;
    keepalive_requests          300;
    keepalive_timeout            30s;
    reset_timedout_connection      on;

    include /etc/nginx/snippets/shield-mode.conf;
    error_page 429 = @rate_limited;

    if ($blocked_ip) {
        return 403;
    }
    if ($bad_ua) {
        return 444;
    }
    if ($bad_uri) {
        return 444;
    }

    # 敏感扩展名 / 目录（$uri 已解码归一化，能吃掉 %2eenv、//.env 这类绕过）
    if ($bad_ext) {
        return 444;
    }
    if ($bad_dot) {
        return 444;
    }

    # ---- SCAN-DROP：扫描器快速丢弃（先于跳转，省带宽也省日志）----
    if ($request_uri ~* "^(/\.(?!well-known/)|/wp-|/wordpress|/phpmyadmin|/pma|/vendor/|/phpunit|/laravel|/cgi-bin|/actuator|/console|/manager|/solr|/jenkins|/backup|/db\.|/shell|/xmlrpc|/mcp|/sse|/boaform|/hnap1)") {
        return 444;
    }
    if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") {
        return 444;
    }

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/dsh-tunnel.conf;

    # 限流响应统一成前端认识的形状，并带上 Retry-After
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"ok":false,"error":{"code":"TOO_MANY","message":"请求太频繁了，请稍后再试"},"data":{"retryAfter":5}}';
    }

    # 健康检查（本机 only，顺手修好 jingyu-status 的探测）
    location = /api/healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME 必须能在 HTTP 上直出，见文件头说明
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # 其余一律跳 HTTPS，用 301 而不是 302：这是永久策略，搜索引擎会记住
    # 跳转也要限流：攻击者刷 80 一样吃 CPU 与日志
    location / {
        limit_req  zone=html_limit burst=40 nodelay;
        include /etc/nginx/snippets/shield-strict-loc.conf;
        return 301 https://$host$request_uri;
    }
}
