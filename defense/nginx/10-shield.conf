# ============================================================================
# 鲸域边缘防护 · 第 1 层（http 上下文）—— /etc/nginx/conf.d/10-shield.conf
# 2026-10-29 为「群友攻击测试」上线；所有 *_zone / map / geo 只能写在 http{} 里
#
# 设计与约束：
#   · limit_req_zone / limit_conn_zone 只能出现在 http 上下文，故集中放本文件
#   · api_limit 已由 00-limit-req.conf 定义（30r/s），此处不重复定义
#   · map 的 key 为空串时 nginx 不计入限流 —— 用它实现「只对敏感写操作计数」
# ============================================================================

# ---------- 每 IP 并发连接 ----------
limit_conn_zone $binary_remote_addr zone=conn_all:10m;
limit_conn_zone $binary_remote_addr zone=conn_big:10m;
limit_conn_zone $binary_remote_addr zone=conn_ws:10m;

# ---------- 每 IP 请求速率 ----------
# 全站兜底（server 级默认；location 内一旦写 limit_req 就由 location 自己负责）
limit_req_zone $binary_remote_addr zone=site_burst:10m        rate=10r/s;
# HTML/跳转类（location / 用；正常用户一次只加载一次）
limit_req_zone $binary_remote_addr zone=html_limit:10m        rate=3r/s;
# 攻击模式专用（1r/s），由 snippets/shield-mode.conf 切换进来
limit_req_zone $binary_remote_addr zone=site_burst_strict:10m rate=1r/s;
# 静态大文件（whale 视频 / uploads 图片 / assets）
limit_req_zone $binary_remote_addr zone=bigfile_limit:10m     rate=8r/s;
limit_req_zone $binary_remote_addr zone=img_limit:10m         rate=20r/m;   # /api/img 服务端抓取+落盘，必须狠限

# ---------- 敏感写操作的专属限流（12r/m ≈ 每 5 秒 1 次）----------
# 只有下面这些「会写库 / 会发短信 / 会落盘」的请求取真实 IP 作为 key，
# 其余请求 key 为空串 = 完全不计数，所以浏览、轮询、加载视频都不受影响。
map "$request_method:$uri" $wr_key {
    default                            "";
    "POST:/api/auth/login"             $binary_remote_addr;
    "POST:/api/auth/register"          $binary_remote_addr;
    ~^POST:/api/auth/phone/            $binary_remote_addr;
    ~^POST:/api/upload/                $binary_remote_addr;
    ~^POST:/api/posts$                 $binary_remote_addr;
    ~^POST:/api/posts/[0-9]+/comments$ $binary_remote_addr;
    ~^POST:/api/forums/[^/]+/threads$  $binary_remote_addr;
}
limit_req_zone $wr_key zone=wr_limit:10m rate=12r/m;

# ---------- 出网抓 README 的限流（全站最贵的接口）----------
# /api/plugins/:id/readme 未命中缓存时会去 GitHub 拉正文，单次最长挂 60s。
# 应用层限流是 120/min，等于每分钟可开 120 个出网任务 —— 2 核机扛不住，压到 6/min。
map "$request_method:$uri" $rd_key {
    default "";
    ~^GET:/api/plugins/[^/]+/readme$ $binary_remote_addr;
}
limit_req_zone $rd_key zone=readme_limit:10m rate=6r/m;

# ---------- 恶意 / 扫描器 User-Agent ----------
map $http_user_agent $bad_ua {
    default 0;
    ""      0;
    ~*(sqlmap|nikto|nuclei|nmap|masscan|zgrab|gobuster|dirsearch|ffuf|wfuzz|hydra|medusa|ncrack|acunetix|netsparker|nessus|openvas|w3af|commix|arachni|xray|dirbuster|whatweb|brutespray|censys|shodan|zmap|rustscan|naabu|katana|subfinder|feroxbuster|jaeles|wpscan|joomscan|droopescan|ysoserial|metasploit|msfconsole|pocsuite|goby|fscan|vulmap) 1;
}

# ---------- 可疑请求串（SQLi / XSS / 穿越 / 模板注入 / 云元数据）----------
# 注意：$request_uri 是「未解码」的原始串（query 里的空格是 %20、单引号是 %27），
# 所以每种判据都必须同时写「原文形态」和「百分号编码形态」，否则一条编码就能绕过。
map $request_uri $bad_uri {
    default 0;
    # SQL 注入：union select / 报错注入 / 时间盲注 / 读文件 / 写文件
    ~*union(%20|%09|%0a|%2b|\+|\*|[[:space:]/])+select                                          1;
    ~*(information_schema|(sleep|benchmark|load_file|extractvalue|updatexml)(%28|\())               1;
    ~*(into(%20|\+|[[:space:]])+outfile)                                                            1;
    # 经典引号注入：' or 1 / ' and 1 / %27 or 1
    ~*(%27|')(%20|\+|[[:space:]])+(or|and)(%20|\+|[[:space:]])+[0-9]                               1;
    # XSS：<script / onerror= / javascript:
    ~*(%3cscript|%3c%2fscript|<script|%3cimg|%3csvg|onerror(%3d|=)|onload(%3d|=)|javascript(%3a|:)) 1;
    # 路径穿越（原文与双重编码）
    ~*(\.\./|%2e%2e|%252e%252e|%c0%ae)                                                             1;
    # 敏感文件与 JNDI / 云元数据 SSRF
    ~*(/etc/passwd|win\.ini|boot\.ini|/proc/self/environ)                                           1;
    ~*(jndi(%3a|:)(ldap|rmi|dns|iiop))                                                              1;
    ~*(169\.254\.169\.254|metadata\.google\.internal|100\.100\.100\.200)                        1;
}

# ---------- 动态封禁名单 ----------
# /usr/local/sbin/jingyu-defense ban <ip> 往里追加一行「<ip> 1;」；
# 文件为空时 $blocked_ip 恒为 0，对任何人无影响。
# 敏感扩展名 / 目录：$uri 是解码并归一化后的路径，能吃掉 %2eenv 这类编码绕过
map $uri $bad_ext {
    default 0;
    "~*(^|/)(\.env|\.git|\.svn|\.hg|\.[Dd][Ss]_[Ss]tore)$"                      1;
    "~*\.(env|php\d?|phtml|pht|asp|aspx|ashx|jsp|jspx|do|action|zip|tar|tgz|gz|bz2|7z|rar|sql|bak|old|orig|swp|swo|log|ini|conf|yml|yaml|sh|py|rb|pl)$"  1;
    "~*/server/"                                                                    1;
}

# 以点开头的敏感文件：$request_uri 未解码，%2e 形态也要覆盖
#   只匹配「路径段开头」形态（前一个字符是 / 或 %2f 或串首），避免把 ?q=.env 这种查询误杀
map $request_uri $bad_dot {
    default 0;
    "~*(^|/|%2[Ff])(\.|%2[Ee])(env|git|svn|hg)"                        1;
    "~*(^|/)(\.DS_Store|\.htaccess|\.htpasswd|\.user\.ini)"          1;
}

geo $blocked_ip {
    default 0;
    include /etc/nginx/blocked_ips.conf;
}
