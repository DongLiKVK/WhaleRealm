# 鲸域 · 443 站点（2026-10-29 启用正式证书 + 正常服务）
#
# 变更历史：
#   2026-10-29  启用 LE 正式证书（seekbbs.cn + www.seekbbs.cn），与 80 同构提供服务
#   2026-10-29  攻击测试加固：限流/限连/恶意指纹丢弃/去软404/超时收紧（见各处 2026-10-29 注释）
#
# 为什么 443 要和 80 一起服务而不是继续 301 回 HTTP：
#   登录态、支付、以及备案要求的传输安全都需要 HTTPS；301 回 HTTP 等于主动降级。
#
# 守卫分层（新增，按代价从低到高）：
#   1. if ($blocked_ip) → 403     动态封禁名单（jingyu-defense ban）
#   2. if ($bad_ua)     → 444     扫描器 UA 直接断连，不回任何字节
#   3. if ($bad_uri)    → 444     SQLi/XSS/穿越/云元数据 载荷直接断连
#   4. SCAN-DROP        → 444     历史扫描路径（.git / wp- / phpmyadmin ...）
#   5. limit_req/limit_conn       按 location 的代价分级限流（zone 定义在 conf.d/10-shield.conf）
#   6. 超时收紧                    慢速攻击（slowloris / slow POST）占用 worker 的时间上限

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;

    server_name seekbbs.cn www.seekbbs.cn _;

    ssl_certificate     /etc/letsencrypt/live/seekbbs.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seekbbs.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    root  /var/www/jingyu/dist;
    index index.html;

    charset utf-8;
    client_max_body_size 8m;

    # ==== 2026-10-29 抗慢速/抗堆积 ====
    client_header_timeout        10s;   # 读完请求头的最长时间（slowloris 主战场）
    client_body_timeout          15s;   # 两次读 body 之间的间隔上限（slow POST）
    send_timeout                 20s;   # 向客户端写响应的时间上限
    keepalive_requests          300;    # 单连接最多复用 300 次，防止一条连接刷到底
    keepalive_timeout            30s;
    reset_timedout_connection      on;   # 超时直接 RST，跳过 TIME_WAIT 堆积
    http2_max_concurrent_streams   64;   # 单连接并发流上限（1.18 语法）

    # ==== 限流档位（NORMAL / ATTACK，由 jingyu-defense 切换）====
    include /etc/nginx/snippets/shield-mode.conf;
    error_page 429 = @rate_limited;

    # ---- 动态封禁 ----
    if ($blocked_ip) {
        return 403;
    }
    # ---- 扫描器指纹 / 攻击载荷：直接断连 ----
    if ($bad_ua) {
        return 444;
    }
    if ($bad_uri) {
        return 444;
    }

    # 敏感扩展名 / 目录（$uri 已解码归一化，能吃掉 %2eenv、//.env 这类绕过）
    if ($bad_ext) {
        return 444;
    }
    if ($bad_dot) {
        return 444;
    }

    # ---- SCAN-DROP：历史扫描路径 ----
    if ($request_uri ~* "^(/\.(?!well-known/)|/wp-|/wordpress|/phpmyadmin|/pma|/vendor/|/phpunit|/laravel|/cgi-bin|/actuator|/console|/manager|/solr|/jenkins|/backup|/db\.|/shell|/xmlrpc|/mcp|/sse|/boaform|/hnap1)") {
        return 444;
    }
    if ($request_method !~ "^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$") {
        return 444;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/dsh-tunnel.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME 续期也走 80，这里留一份以防 80 被临时改动
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # ---- API（动态请求，单请求最贵）----
    # api_limit(30r/s 已有) + wr_limit(敏感写 12/min) + 并发 16
    # 限流响应统一成前端认识的形状，并带上 Retry-After
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
        return 429 '{"ok":false,"error":{"code":"TOO_MANY","message":"请求太频繁了，请稍后再试"},"data":{"retryAfter":5}}';
    }

    # 健康检查只给本机（原来会泄露 DB_PATH 等内部信息）
    location = /api/healthz {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/shield-strict-loc.conf;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 图片代理：服务端会出网抓取并落盘缓存，是 SSRF/磁盘填充的放大器
    location ^~ /api/img {
        limit_req  zone=img_limit burst=5 nodelay;
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_big 2;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /api/ {
        limit_req  zone=api_limit burst=60 nodelay;
        limit_req  zone=wr_limit  burst=5  nodelay;
        limit_conn conn_all 16;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 防伪造：丢弃客户端自报 XFF
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;   # 原 60s：留 60s 等于每个请求能钉住后端 1 分钟
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- 插件 README（会出网抓 GitHub，最贵）----
    # 6 次/分钟 + 并发 8 + 20s 掐断：攻击者拿它当放大器，最多换来每分钟 6 个 15 秒内的 504
    location ^~ /api/plugins {
        limit_req  zone=api_limit    burst=60 nodelay;
        limit_req  zone=readme_limit burst=2  nodelay;
        limit_conn conn_all 8;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # 防伪造：丢弃客户端自报 XFF
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout    20s;
        proxy_read_timeout    20s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- WebSocket ----
    location ^~ /ws {
        limit_req  zone=api_limit burst=20 nodelay;
        limit_conn conn_ws 8;
        access_log off;   # WS 允许 ?token= 传 JWT，绝不能落日志
        include /etc/nginx/snippets/shield-strict-loc.conf;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 防伪造：丢弃客户端自报 XFF
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- 静态资源（可缓存，单价低但体积大）----
    location ^~ /assets/ {
        limit_req  zone=bigfile_limit burst=60 nodelay;
        limit_conn conn_all 24;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 鲸鱼娘落地页：不能吃 30 天缓存，否则改了脚本用户端不更新
    location = /whale/index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # 后台是独立 SPA，可能有 history 路由深链接 —— 只在 /admin/ 下保留回退，其余一律真 404
    location ^~ /admin/ {
        limit_req  zone=html_limit burst=40 nodelay;
        include /etc/nginx/snippets/shield-strict-loc.conf;
        try_files $uri $uri/ /admin/index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /uploads/ {
        limit_req  zone=bigfile_limit burst=40 nodelay;
        limit_conn conn_big 8;
        limit_conn conn_all 24;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        alias /var/www/jingyu/uploads/;
        expires 30d;
        # 上传目录加一层 CSP sandbox：即使有人把 html/svg 传上来当头像，
        # 也无法以本站同源身份执行脚本（CSP 多条头取交集，只会更严）
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /whale/assets/ {
        limit_req  zone=bigfile_limit burst=60 nodelay;
        limit_conn conn_big 12;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /whale/clips-rand/ {
        limit_req  zone=bigfile_limit burst=60 nodelay;
        limit_conn conn_big 12;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        expires 30d;
        types { video/webm webm; }
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /whale/ {
        limit_req  zone=bigfile_limit burst=40 nodelay;
        limit_conn conn_big 12;
        include /etc/nginx/snippets/shield-strict-loc.conf;

        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ---- 前台页面 ----
    # 2026-10-29：由 try_files $uri $uri/ /index.html 改为 $uri $uri/ =404。
    # 理由：前端是 hash 路由，任何路径本就由 / 或 /index.html 承载；保留回退会让
    # 任意随机路径都返回 200 + 首页 HTML（软 404），扫描器判定「路径存在」，日志全是 200。
    # 现在不存在的路径返回真 404，反而能让 nginx-404scan jail 正常工作。
    location / {
        limit_req  zone=html_limit burst=40 nodelay;
        include /etc/nginx/snippets/shield-strict-loc.conf;
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
